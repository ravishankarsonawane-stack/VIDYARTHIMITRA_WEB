name: Build Hishob Sarathi APK

on:
  workflow_dispatch:
  push:
    paths:
      - "hishob-sarathi-apk/**"
      - "maza-dainik-hishob/hishob-sarathi-empty.html"
      - "maza-dainik-hishob/logo-h.svg"
      - "maza-dainik-hishob/section-hishob.svg"
      - "maza-dainik-hishob/section-gruhini.svg"
      - ".github/workflows/hishob-sarathi-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK platform and build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Capacitor and native Firebase Authentication
        working-directory: hishob-sarathi-apk
        run: npm install

      - name: Prepare app files and native Google sign-in bridge
        working-directory: hishob-sarathi-apk
        run: |
          mkdir -p www
          cp ../maza-dainik-hishob/hishob-sarathi-empty.html www/index.html
          cp ../maza-dainik-hishob/logo-h.svg www/logo-h.svg
          cp ../maza-dainik-hishob/section-mazha.svg www/section-mazha.svg
          cp ../maza-dainik-hishob/section-gruhini.svg www/section-gruhini.svg
          cp ../maza-dainik-hishob/manifest.webmanifest www/manifest.webmanifest
          cat > native-auth-entry.js <<'EOF'
          import { FirebaseAuthentication } from '@capacitor-firebase/authentication';

          window.hishobNativeGoogleSignIn = async function () {
            const result = await FirebaseAuthentication.signInWithGoogle({ skipNativeAuth: true });
            const idToken = result && result.credential && result.credential.idToken;
            if (!idToken) throw new Error('Google कडून ID token मिळाला नाही. Firebase SHA-1 तपासा.');
            const credential = window.firebase.auth.GoogleAuthProvider.credential(idToken);
            await window.firebase.auth().signInWithCredential(credential);
          };
          EOF
          npx esbuild native-auth-entry.js --bundle --format=iife --target=es2020 --outfile=www/native-auth.js
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path("www/index.html")
          s = p.read_text(encoding="utf-8")
          s = s.replace("const APP_BUILD_VERSION = 'web';", f"const APP_BUILD_VERSION = '1.0.{os.environ['GITHUB_RUN_NUMBER']}';", 1)
          s = s.replace("</head>", '<script src="./native-auth.js"></script></head>', 1)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Generate Android project
        working-directory: hishob-sarathi-apk
        run: npx cap add android

      - name: Set increasing Android app version
        working-directory: hishob-sarathi-apk
        env:
          APP_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path("android/app/build.gradle")
          s = p.read_text(encoding="utf-8")
          code, n1 = re.subn(r"\bversionCode\s+\d+", "versionCode " + os.environ["APP_BUILD_NUMBER"], s, count=1)
          name, n2 = re.subn(r'\bversionName\s+"[^"]+"', 'versionName "1.0.' + os.environ["APP_BUILD_NUMBER"] + '"', code, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit("Could not safely set Android versionCode/versionName")
          p.write_text(name, encoding="utf-8")
          PY

      - name: Configure Firebase Android and release signing
        working-directory: hishob-sarathi-apk
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON"
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          python3 -m json.tool android/app/google-services.json > /dev/null
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/hishob-sarathi-release.p12
          python3 - <<'PY'
          from pathlib import Path
          root = Path("android/build.gradle")
          if not root.exists():
              raise SystemExit("Android root build.gradle not found")
          text = root.read_text(encoding="utf-8")
          if "com.google.gms:google-services" not in text:
              block = """buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.google.gms:google-services:4.4.4' }
          }

          """
              root.write_text(block + text, encoding="utf-8")
          app = Path("android/app/build.gradle")
          text = app.read_text(encoding="utf-8")
          if "com.google.gms.google-services" not in text:
              text += "\napply plugin: 'com.google.gms.google-services'\n"
          if "signingConfigs" not in text:
              text += """
          android {
              signingConfigs {
                  release {
                      storeFile file("hishob-sarathi-release.p12")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          """
          app.write_text(text, encoding="utf-8")
          variables = Path("android/variables.gradle")
          if not variables.exists():
              raise SystemExit("Android variables.gradle not found")
          v = variables.read_text(encoding="utf-8")
          if "rgcfaIncludeGoogle" not in v:
              v += "\next.rgcfaIncludeGoogle = true\n"
          if "androidxCredentialsVersion" not in v:
              v += "ext.androidxCredentialsVersion = '1.3.0'\n"
          variables.write_text(v, encoding="utf-8")
          PY

      - name: Sync native plugins
        working-directory: hishob-sarathi-apk
        run: npx cap sync android

      - name: Build signed release APK
        working-directory: hishob-sarathi-apk/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Hishob-Sarathi-Signed-APK
          path: hishob-sarathi-apk/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK release for app updates
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hishob-sarathi-v1.0.${{ github.run_number }}
          name: हिशोब सारथी v1.0.${{ github.run_number }}
          body: |
            हिशोब सारथी Android APK अपडेट.
            
            - जुने ॲप uninstall करू नका.
            - नवीन APK डाउनलोड करून install करा.
            - त्याच Google खात्याने login केल्यास तुमचा Cloud हिशोब उपलब्ध राहील.
          files: hishob-sarathi-apk/android/app/build/outputs/apk/release/app-release.apk
          make_latest: true
