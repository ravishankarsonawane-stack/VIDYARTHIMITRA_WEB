name: Build Hishob Sarathi Empty APK

on:
  workflow_dispatch:
  push:
    paths:
      - "hishob-sarathi-apk/**"
      - "maza-dainik-hishob/hishob-sarathi-empty.html"
      - "maza-dainik-hishob/logo-h.svg"
      - "maza-dainik-hishob/section-hishob.svg"
      - "maza-dainik-hishob/section-gruhini.svg"
      - ".github/workflows/hishob-sarathi-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hishob-sarathi-apk/package.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK platform and build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare app files
        working-directory: hishob-sarathi-apk
        run: |
          mkdir -p www
          cp ../maza-dainik-hishob/hishob-sarathi-empty.html www/index.html
          cp ../maza-dainik-hishob/logo-h.svg www/logo-h.svg
          cp ../maza-dainik-hishob/section-hishob.svg www/section-hishob.svg
          cp ../maza-dainik-hishob/section-gruhini.svg www/section-gruhini.svg
          cp ../maza-dainik-hishob/manifest.webmanifest www/manifest.webmanifest

      - name: Install Capacitor
        working-directory: hishob-sarathi-apk
        run: npm install --no-save @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8

      - name: Generate Android project
        working-directory: hishob-sarathi-apk
        run: npx cap add android

      - name: Sync web app
        working-directory: hishob-sarathi-apk
        run: npx cap sync android

      - name: Build debug APK
        working-directory: hishob-sarathi-apk/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hishob-Sarathi-Empty-APK
          path: hishob-sarathi-apk/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
