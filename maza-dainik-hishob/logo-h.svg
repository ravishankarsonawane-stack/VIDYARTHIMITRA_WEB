<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">हिशोब सारथी</title><desc id="desc">गडद निळ्या पार्श्वभूमीवर सोनेरी ह अक्षर, कॅल्क्युलेटर आणि हिशोब सारथी नाव</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0753a6"/><stop offset=".48" stop-color="#082c65"/><stop offset="1" stop-color="#03152f"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff2a6"/><stop offset=".38" stop-color="#ffd83e"/><stop offset=".72" stop-color="#f5ad16"/><stop offset="1" stop-color="#b97808"/></linearGradient>
 <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#36c5ff"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#1487ff"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="5"/><feOffset dy="5"/><feComponentTransfer><feFuncA type="linear" slope=".45"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
